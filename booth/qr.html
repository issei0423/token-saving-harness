<!doctype html>
<html lang="ja">
<head>

<title>トークン節約ハーネス QR</title>
<style>
  :root { --ink: #111111; --sub: #5a5a5a; --bg: #ffffff; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", "Meiryo", system-ui, sans-serif;
    display: grid; place-items: center; min-height: 100vh; padding: 4vmin;
  }
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    gap: 6vmin; align-items: center; width: min(100%, 1560px);
  }
  .qr svg { display: block; width: min(100%, 86vh); height: auto; margin: 0 auto; }
  .eyebrow { font-size: clamp(14px, 1.7vw, 28px); font-weight: 700; letter-spacing: .08em; margin: 0 0 .5em; color: var(--sub); }
  h1 { font-size: clamp(30px, 5vw, 84px); line-height: 1.15; margin: 0 0 .4em; }
  .lead { font-size: clamp(16px, 2vw, 33px); line-height: 1.6; margin: 0 0 1.1em; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3vmin; margin: 0 0 1em; }
  .stat { border-top: 4px solid var(--ink); padding-top: .6em; }
  .num { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: clamp(40px, 6.2vw, 104px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .cap { font-size: clamp(13px, 1.45vw, 24px); line-height: 1.45; margin-top: .55em; }
  .note { font-size: clamp(11px, 1.1vw, 18px); color: var(--sub); margin: 0 0 1.5em; line-height: 1.5; }
  .url {
    display: inline-block; font-family: Consolas, "SF Mono", Menlo, monospace;
    font-size: clamp(14px, 1.85vw, 30px); word-break: break-all;
    padding: .55em .8em; border: 2px solid var(--ink); border-radius: 10px;
  }
  @media (max-width: 760px), (orientation: portrait) {
    main { grid-template-columns: 1fr; gap: 5vmin; }
    .qr svg { width: min(100%, 50vh); }
  }
</style>
</head>
